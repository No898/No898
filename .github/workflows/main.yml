name: generate animation

on:
  # Spouští se automaticky každý den.
  schedule:
    - cron: "0 0 * * *"

  # Umožňuje ruční spuštění workflow.
  workflow_dispatch:

  # Přegeneruje animaci po změně profilového repozitáře.
  push:
    branches:
      - main

concurrency:
  group: contribution-snake
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test contribution data adapter
        run: node --test scripts/chunked-contributions.test.mjs

      - name: Install snake generator
        run: >-
          npm install
          --prefix "$RUNNER_TEMP/snake-generator"
          --no-save
          --ignore-scripts
          --omit=optional
          generate-snake-animation@3.5.0

      - name: Generate contribution snake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node \
            --import "$GITHUB_WORKSPACE/scripts/preload-chunked-contributions.mjs" \
            "$RUNNER_TEMP/snake-generator/node_modules/generate-snake-animation/cli.js" \
            --github_user="${GITHUB_REPOSITORY_OWNER}" \
            --output="dist/github-contribution-grid-snake.svg" \
            --output="dist/github-contribution-grid-snake-dark.svg?palette=github-dark"

      - name: Publish SVG files to gh-pages
        run: |
          publish_dir="$RUNNER_TEMP/contribution-snake-pages"
          git fetch origin gh-pages
          git worktree add --detach "$publish_dir" origin/gh-pages

          install -m 0644 \
            dist/github-contribution-grid-snake.svg \
            "$publish_dir/github-contribution-grid-snake.svg"
          install -m 0644 \
            dist/github-contribution-grid-snake-dark.svg \
            "$publish_dir/github-contribution-grid-snake-dark.svg"

          git -C "$publish_dir" add \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Contribution snake is already up to date."
            exit 0
          fi

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" commit -m "Update contribution snake"
          git -C "$publish_dir" push origin HEAD:gh-pages
